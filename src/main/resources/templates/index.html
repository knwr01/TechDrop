<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>TechDrop Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">TechDrop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarLinks">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/products">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about">About/Contact</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/add-product">Add Product</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 main-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>TechDrop Products</h1>

        <a href="/add-product" class="btn btn-success" sec:authorize="hasAnyRole('ADMIN','STAFF')">
            Add Product
        </a>
    </div>

    <div class="row mb-4">

        <div class="col-md-4">
            <form method="get" action="/products">
                <input
                        type="text"
                        class="form-control"
                        name="keyword"
                        placeholder="Search products">
            </form>
        </div>

        <div class="col-md-4">
            <form method="get" action="/products">
                <select class="form-select" name="category" onchange="this.form.submit()">
                    <option value="">Filter by Category</option>
                    <option value="Smartphones">Smartphones</option>
                    <option value="Laptops">Laptops</option>
                    <option value="Audio">Audio</option>
                </select>
            </form>
        </div>

        <div class="col-md-4">
            <form method="get" action="/products">
                <select class="form-select" name="sort" onchange="this.form.submit()">
                    <option value="">Sort By</option>
                    <option value="name">Product Name (A-Z)</option>
                    <option value="priceAsc">Price: Low to High</option>
                    <option value="priceDesc">Price: High to Low</option>
                </select>
            </form>
        </div>

    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th sec:authorize="hasAnyRole('ADMIN','STAFF')">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.productId}"></td>
            <td th:text="${product.productName}"></td>
            <td th:text="${product.brand}"></td>
            <td th:text="${product.category}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stockQuantity}"></td>
            <td sec:authorize="hasAnyRole('ADMIN','STAFF')">
                <a th:href="@{/edit-product/{id}(id=${product.productId})}"
                   class="btn btn-sm btn-outline-primary">Edit</a>
                <form th:action="@{/delete-product/{id}(id=${product.productId})}"
                      method="post" class="d-inline" sec:authorize="hasRole('ADMIN')"
                      onsubmit="return confirm('Delete this product?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<div class="footer">
    <p>TechDrop &copy; 2026 - Humber College Web App Development Final Project</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
