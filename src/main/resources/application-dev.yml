# Dev profile - in-memory H2 database.
# Data resets every time the app restarts since data.sql runs on startup.
# Good for local development / demoing without setting up MySQL.

spring:
  datasource:
    url: jdbc:h2:mem:techdrop
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
# with this on you can check the db in the browser at
# http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:techdrop, user: sa, no password)
